name: Import diagnostic report

on:
  push:
    paths:
      - '.github/workflows/import-diagnostic.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch report
        run: |
          set -euo pipefail
          curl -fsSL https://paste.rs/YH2AE -o stage1-report.txt
          test -s stage1-report.txt
      - name: Commit report
        run: |
          git config user.name 'telegram-job-agent-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add stage1-report.txt
          git commit -m 'Import stage1 repair report' || exit 0
          git push
